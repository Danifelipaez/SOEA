name: CI

# Pipeline de integración continua (P1.9 auditoría).
# Corre en cada push y PR: build + tests del backend .NET y build del frontend Angular.

on:
  push:
    branches: [Developing] # main lo cubre deploy.yml, que reutiliza este workflow
  pull_request:
    branches: [main, Developing]
  workflow_call:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    # NEW-9 auditoría 2026-09-28: sin Postgres, las pruebas de integración (FK, índices únicos, migraciones,
    # API completo) se omitían en silencio y CI salía en verde sin haber ejecutado ninguna. Contenedor
    # desechable, credencial sin valor fuera de este job. Con SOEA_TEST_DB definida, un servidor inalcanzable
    # hace FALLAR las pruebas (PostgresPruebas.cs) en vez de omitirlas.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOEA_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore SOEA.sln

      - name: Build
        run: dotnet build SOEA.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SOEA.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/soea-angular
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/soea-angular/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
